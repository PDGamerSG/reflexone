[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "reflexone"
version = "0.1.0"
description = "Trainable, calibrated, non-autoregressive decision models for software workflows"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "torch>=2.5,<3",
  "transformers>=4.46,<5",
  "safetensors>=0.4",
  "numpy>=1.26,<3",
  "scipy>=1.14,<2",
  "scikit-learn>=1.5,<2",
  "pydantic>=2.9,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.8,<1",
    "httpx2>=2.16.0",
]

[project.scripts]
reflexone = "reflexone.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reflexone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
